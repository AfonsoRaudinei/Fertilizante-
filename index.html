<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#007AFF">
<title>FertiCalc — SoloForte</title>
<link rel="stylesheet" href="app.css">
</head>

<body>

<!-- HEADER -->
<header id="hdr">
  <div class="brand">
    <div class="brand-logo">🌱</div>
    <div class="brand-txt">
      <div class="brand-name">FertiCalc</div>
      <div class="brand-sub">SoloForte</div>
    </div>
  </div>

  <span class="ht" id="hdr-title">Fertilizantes</span>

  <div class="hr">
    <button class="btn-xs" onclick="navTo('import')">📥 Importar</button>
    <button class="btn-xs" onclick="navTo('calc')">🧪 Calculadora</button>
    <button class="btn-add" onclick="openAddProduct()">+ Novo Produto</button>
  </div>
</header>

<!-- MAIN -->
<div id="body">

  <!-- ESQUERDA -->
  <section id="lp">
    <div class="ph">
      <span class="pt">Cadastrados</span>
      <span class="pc" id="fert-cnt">0 produtos</span>
    </div>
    <div class="pl" id="flist"></div>
  </section>

  <!-- DIREITA -->
  <section id="rp">

    <div class="view active" id="view-calc">

      <div class="filters">

        <div class="ftitle">Parâmetros do cálculo</div>

        <div class="g2">
          <div class="fi">
            <span class="sl">Cultura</span>
            <select class="sel" id="fc">
              <option>Soja</option>
              <option>Milho</option>
            </select>
          </div>
          <div class="fi">
            <span class="sl">Área (ha)</span>
            <input type="number" class="inp" id="fa" value="900">
          </div>
        </div>

        <span class="sl">Metas nutricionais</span>

        <div class="g4">
          <div class="fi"><span class="sl">N</span><input class="inp" id="fn" value="0"></div>
          <div class="fi"><span class="sl">P₂O₅</span><input class="inp" id="fp" value="90"></div>
          <div class="fi"><span class="sl">K₂O</span><input class="inp" id="fk" value="120"></div>
          <div class="fi"><span class="sl">S</span><input class="inp" id="fs" value="0"></div>
        </div>

        <div class="g2">
          <div class="fi">
            <span class="sl">K₂O máx. base</span>
            <input class="inp" id="fkbase" value="0">
          </div>
        </div>

        <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">

          <button class="btn-c" onclick="run()">⚡ Calcular</button>

          <!-- ✅ BOTÃO NOVO -->
          <button id="btn-reset" class="btn-outline" style="display:none" onclick="resetCalc()">
            ← Refazer cálculo
          </button>

        </div>

      </div>

      <!-- RESULTADO -->
      <div id="res-scroll">

        <div class="empty-r" id="emp-calc">
          <div style="font-size:24px">📊</div>
          <div>Aguardando cálculo</div>
        </div>

        <div id="res-cards" style="display:none"></div>

      </div>

    </div>

  </section>
</div>

<!-- TOAST -->
<div id="tw"></div>

<script src="app.js"></script>

</body>
</html>
