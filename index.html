<!DOCTYPE html>
<html lang="pt-BR">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;background:#F5F5F7;color:#1D1D1F;font-size:13px;padding:20px}
h1{font-size:1.1em;font-weight:700;margin-bottom:4px}
.sub{font-size:.78em;color:#6B7280;margin-bottom:16px}
.card{background:#fff;border-radius:12px;border:1px solid #E5E7EB;padding:16px;margin-bottom:12px}
.card-title{font-size:.68em;font-weight:600;color:#9CA3AF;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:#F5F5F7;border-radius:8px;padding:10px;text-align:center}

.stat-l{font-size:.62em;color:#9CA3AF;text-transform:uppercase;letter-spacing:.3px}
.btn{width:100%;height:42px;border:none;background:#007AFF;color:#fff;font-size:.9em;font-weight:700;border-radius:10px;cursor:pointer;transition:.15s}
.btn:hover{background:#0051D5;transform:translateY(-1px)}
.btn:disabled{background:#9CA3AF;transform:none;cursor:not-allowed}
.btn-danger{background:#fff;color:#FF3B30;border:1px solid rgba(255,59,48,.3);margin-top:8px}
.btn-danger:hover{background:#FFEBEE;transform:none}
.list{max-height:320px;overflow-y:auto;border-top:1px solid #E5E7EB;margin-top:8px}
.list::-webkit-scrollbar{width:3px}
.list::-webkit-scrollbar-thumb{background:#D1D1D6;border-radius:2px}
.item{display:flex;align-items:center;justify-content:space-between;padding:7px 2px;border-bottom:1px solid #F0F0F0;font-size:.78em}
.item:last-child{border:none}
.item-name{font-weight:600;color:#1D1D1F;flex:1}
.item-sup{color:#6B7280;font-size:.9em;margin-top:1px}
.item-price{color:#007AFF;font-weight:700;white-space:nowrap;margin-left:10px}
.badge{font-size:.62em;font-weight:600;padding:2px 5px;border-radius:4px;margin-left:5px}
.b-ok{background:#E8F5E9;color:#2E7D32}
.b-rev{background:#FFF3E0;color:#E65100}
#result{display:none;padding:12px;background:#E8F5E9;border-radius:8px;font-size:.82em;font-weight:600;color:#2E7D32;text-align:center;margin-top:10px}
</style>

    <div class="stat"><div class="stat-n" id="s-rev" style="color:#FF9500">0</div><div class="stat-l">Revisar</div></div>
    <div class="stat"><div class="stat-n" id="s-forn" style="color:#007AFF">3</div><div class="stat-l">Fornecedores</div></div>

  <button class="btn" onclick="importar()" id="btn-imp">⚡ Importar todos os produtos</button>
  <button class="btn btn-danger" onclick="limpar()">Limpar tudo do localStorage</button>
  <div id="result"></div>

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5)+Math.random().toString(36).slice(2,5);

function parseNPK(name){
  const n={};
  // Especiais Cibra
  if(/KCL\s*60/i.test(name)){n.K2O=60;return n}
  const kcl=name.match(/KCL\s*(\d+)/i);if(kcl){n.K2O=parseFloat(kcl[1]);return n}
  const ur=name.match(/UREIA\s*(\d+)/i);if(ur){n.N=parseFloat(ur[1]);return n}
  const map=name.match(/MAP\s*(\d+)[-–](\d+)/i);if(map){n.N=parseFloat(map[1]);n.P2O5=parseFloat(map[2]);return n}
  const tsp=name.match(/TSP\s*(\d+)/i);if(tsp){n.P2O5=parseFloat(tsp[1]);return n}
  const ssp=name.match(/SSP\s*(\d+)/i);if(ssp){n.P2O5=parseFloat(ssp[1]);return n}
  const sam=name.match(/SAM\s*([\d.]+)[/,\s]([\d.]+)/i);if(sam){n.N=parseFloat(sam[1]);n.S=parseFloat(sam[2]);return n}
  // NPK no nome
  const npk=name.match(/(\d{2})[-–](\d{2})[-–](\d{2})/);
  if(npk){n.N=parseInt(npk[1]);n.P2O5=parseInt(npk[2]);n.K2O=parseInt(npk[3]);return n}
  // CIBRAMIX com formato "XX-XX-XX"
  const npk2=name.match(/(\d+)-(\d+)-(\d+)/);
  if(npk2){n.N=parseInt(npk2[1]);n.P2O5=parseInt(npk2[2]);n.K2O=parseInt(npk2[3]);return n}
  return null;
}

function mkProd(name,supplier,delivery,price,freight=0){
  const nuts=parseNPK(name);
  return{
    id:uid(),active:true,
    status:nuts&&Object.keys(nuts).length>0?'ok':'review',
    name,supplier,delivery,
    priceTon:price,freightTon:freight,minLoadTon:0,
    nutrients:nuts||{},micros:{},
    createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()
  };
}

const TODOS=[...CIBRA,...TIMAC,...MOTTA];
const TOK=TODOS.filter(p=>p.status==='ok').length;
const TREV=TODOS.filter(p=>p.status==='review').length;

document.getElementById('s-total').textContent=TODOS.length;
document.getElementById('s-ok').textContent=TOK;
document.getElementById('s-rev').textContent=TREV;
document.getElementById('prev-cnt').textContent=TODOS.length;

const brl=n=>'R$ '+n.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtN=n=>{if(!n)return'—';return['N','P2O5','K2O','S'].filter(k=>n[k]>0).map(k=>k.replace('P2O5','P₂O₅').replace('K2O','K₂O')+' '+n[k]+'%').join(' · ')||'—'};

document.getElementById('prev-list').innerHTML=TODOS.map(p=>`
  <div class="item">
    <div style="flex:1;min-width:0">
      <div class="item-name">${p.name}<span class="badge ${p.status==='ok'?'b-ok':'b-rev'}">${p.status==='ok'?'OK':'Revisar'}</span></div>
      <div class="item-sup">${p.supplier} · ${p.delivery} · ${fmtN(p.nutrients)}</div>
    </div>
    <div class="item-price">${brl(p.priceTon)}/t</div>
  </div>`).join('');

function importar(){
  const existing=JSON.parse(localStorage.getItem('fc_ferts')||'[]');
  const merged=[...existing];
  let added=0,skipped=0;
  TODOS.forEach(p=>{
    const dup=existing.some(e=>e.name.toLowerCase()===p.name.toLowerCase()&&e.supplier.toLowerCase()===p.supplier.toLowerCase()&&e.delivery.toLowerCase()===p.delivery.toLowerCase());
    if(dup){skipped++}else{merged.push(p);added++}
  });
  localStorage.setItem('fc_ferts',JSON.stringify(merged));
  const r=document.getElementById('result');
  r.style.display='block';
  r.textContent=`✅ ${added} produtos adicionados${skipped?' · '+skipped+' duplicados ignorados':''}. Abra o FertiCalc.`;
  document.getElementById('btn-imp').disabled=true;
  document.getElementById('btn-imp').textContent='Importação concluída ✓';
}

function limpar(){
  if(!confirm('Limpar TODOS os produtos do FertiCalc?'))return;
  localStorage.removeItem('fc_ferts');
  const r=document.getElementById('result');
  r.style.display='block';r.style.background='#FFEBEE';r.style.color='#C62828';
  r.textContent='🗑 localStorage limpo.';
}
