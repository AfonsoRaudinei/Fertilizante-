<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f5f8" />
    <title>Calculadora Inteligente de Fertilizantes</title>
    <link rel="manifest" href="/manifest.json?v=7" />
    <link rel="stylesheet" href="/css/variables.css?v=7" />
    <link rel="stylesheet" href="/css/app.css?v=7" />
    <link rel="stylesheet" href="/css/components.css?v=7" />
  </head>
  <body>
    <aside class="side-panel" id="side-panel" aria-hidden="true">
      <nav class="side-nav" aria-label="Navegação principal">
        <h2 class="panel-title">Menu</h2>
        <button class="nav-item" type="button">Fertilizantes</button>
        <button class="nav-item" type="button">Fretes</button>
        <button class="nav-item" type="button">Fabricantes</button>
        <button class="nav-item" type="button">Culturas</button>
        <button class="nav-item" type="button">Configurações</button>
      </nav>
    </aside>

    <aside class="sheet-panel" id="fert-sheet" aria-hidden="true">
      <div class="sheet-head">
        <h2 class="sheet-title">Novo fertilizante</h2>
        <button id="sheet-close" class="icon-button icon-button--sm" type="button" aria-label="Fechar cadastro">✕</button>
      </div>
      <form id="fert-form" class="sheet-form" autocomplete="off">
        <label class="field-label">Nome<input class="field-input" name="name" type="text" placeholder="Ex.: MAP" required /></label>
        <label class="field-label">Fabricante<select class="field-input" name="manufacturer" required><option value="">Selecione</option></select></label>
        <div class="field-grid">
          <label class="field-label">Preço/t<input class="field-input" name="price" type="number" min="0" step="0.01" placeholder="0,00" required /></label>
          <label class="field-label">Frete/t<input class="field-input" name="freight" type="number" min="0" step="0.01" placeholder="0,00" required /></label>
        </div>
        <label class="field-label">Carga mínima (t)<input class="field-input" name="minLoad" type="number" min="0" step="0.01" placeholder="0" required /></label>
        <div class="nutrient-box">
          <h3 class="nutrient-title">Nutrientes</h3>
          <div id="nutrient-list" class="nutrient-list"></div>
          <div id="nutrient-editor" class="nutrient-editor" hidden>
            <select class="field-input" id="nutrient-kind"><option value="">Nutriente</option><option>N</option><option>P₂O₅</option><option>K₂O</option><option>Ca</option><option>Mg</option><option>S</option><option>B</option><option>Zn</option></select>
            <input class="field-input" id="nutrient-value" type="number" min="0" max="100" step="0.01" placeholder="%" />
            <button id="nutrient-save" class="primary-btn" type="button">Confirmar nutriente</button>
          </div>
          <button id="nutrient-add" class="ghost-btn" type="button">＋ Adicionar nutriente</button>
        </div>
        <button class="primary-btn" type="submit">Salvar fertilizante</button>
      </form>
    </aside>

    <aside class="sheet-panel" id="import-sheet" aria-hidden="true">
      <div class="sheet-head">
        <h2 class="sheet-title">Importar lista</h2>
        <button id="import-close" class="icon-button icon-button--sm" type="button" aria-label="Fechar importação">✕</button>
      </div>
      <div class="sheet-form">
        <label class="field-label">Lista colada
          <textarea id="import-text" class="field-input textarea-lg" placeholder="Fornecedor | Produto | Entrega | Frete | Preço"></textarea>
        </label>
        <div class="field-grid">
          <label class="field-label">Fornecedor padrão
            <select id="import-default-supplier" class="field-input"><option value="__line__">Manter da linha</option></select>
          </label>
          <label class="field-label">Entrega padrão
            <select id="import-default-delivery" class="field-input"><option value="__line__">Manter da linha</option><option>Julho</option><option>Mai-Jul</option><option>Imediata</option></select>
          </label>
        </div>
        <label class="field-label">Frete/t padrão
          <input id="import-default-freight" class="field-input" type="text" placeholder="R$ 0,00" />
        </label>
        <label class="field-label field-label--row"><input id="ignore-duplicates" type="checkbox" />Ignorar duplicados possíveis</label>
        <label class="field-label">Quando houver duplicado
          <select id="duplicate-mode" class="field-input">
            <option value="import_anyway">Importar mesmo assim</option>
            <option value="update_price">Atualizar preço existente</option>
            <option value="ignore">Ignorar duplicado</option>
          </select>
        </label>
        <div class="field-grid">
          <button id="import-preview-btn" class="ghost-btn" type="button">Pré-visualizar</button>
          <button id="import-apply-btn" class="primary-btn" type="button">Importar</button>
        </div>
        <div id="import-preview" class="result-wrap"><p class="fert-sub">A prévia mostrará status por linha.</p></div>
      </div>
    </aside>

    <div class="backdrop" id="backdrop" hidden></div>

    <header class="top-bar">
      <button id="menu-toggle" class="icon-button" type="button" aria-label="Abrir menu">☰</button>
      <h1 class="app-title">Calculadora Inteligente de Fertilizantes</h1>
    </header>

    <main class="layout" id="app">
      <section class="pane">
        <article class="card">
          <div class="card-head">
            <h2>Fertilizantes</h2>
            <div class="card-actions-inline">
              <button id="import-list-btn" class="ghost-btn" type="button">Importar lista</button>
              <button id="add-product" class="ghost-btn" type="button">＋ Adicionar produto</button>
            </div>
          </div>
          <div id="fert-cards" class="compact-list"></div>
        </article>
      </section>

      <section class="pane">
        <article class="card">
          <h2>Resultados</h2>
          <form id="solver-form" class="sheet-form">
            <div class="field-grid">
              <label class="field-label">Cultura<select class="field-input" name="culture"></select></label>
              <label class="field-label">Nutriente principal<select class="field-input" name="principal" required><option value="N">N</option><option value="P₂O₅">P₂O₅</option><option value="K₂O">K₂O</option></select></label>
            </div>
            <div class="field-grid">
              <label class="field-label">Meta N (kg/ha)<input class="field-input" name="targetN" type="number" min="0" step="0.01" value="0" /></label>
              <label class="field-label">Meta P₂O₅ (kg/ha)<input class="field-input" name="targetP" type="number" min="0" step="0.01" value="0" /></label>
            </div>
            <div class="field-grid">
              <label class="field-label">Meta K₂O (kg/ha)<input class="field-input" name="targetK" type="number" min="0" step="0.01" value="0" /></label>
              <label class="field-label">Máx fertilizantes<select class="field-input" name="maxProducts"><option value="2">2</option><option value="3" selected>3</option><option value="4">4</option></select></label>
            </div>
            <div class="field-grid">
              <label class="field-label">Critério principal<select class="field-input" name="criterion"><option value="balanced">Balanceado</option><option value="cost">Menor custo</option><option value="freight">Menor frete</option><option value="nutrition">Menor erro nutricional</option></select></label>
              <label class="field-label">Mostrar combinações<select class="field-input" name="limit"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option></select></label>
            </div>
            <button class="primary-btn" type="submit">Buscar combinações vencedoras</button>
          </form>

          <div id="solver-result" class="result-wrap"><p class="fert-sub">Defina os filtros e execute a busca.</p></div>

          <div class="result-wrap">
            <label class="field-label">OpenRouter API Key<input id="openrouter-key" class="field-input" type="password" placeholder="sk-or-v1-..." /></label>
            <div class="field-grid">
              <label class="field-label field-label--row"><input id="save-key-consent" type="checkbox" />Salvar chave neste navegador</label>
              <button id="clear-key-btn" class="ghost-btn" type="button">Limpar chave</button>
            </div>
            <button id="ai-explain-btn" class="ghost-btn" type="button">Explicar resultado (IA contextual)</button>
            <article class="result-card"><p id="ai-output" class="fert-sub">A IA apenas explica o resultado do solver. Não calcula nem altera valores.</p></article>
          </div>
        </article>
      </section>
    </main>

    <script src="/js/storage.js?v=7" defer></script>
    <script src="/js/ui.js?v=7" defer></script>
    <script src="/js/import-parser.js?v=7" defer></script>
    <script src="/js/events.js?v=7" defer></script>
    <script src="/js/router.js?v=7" defer></script>
    <script src="/solver/formulas.js?v=7" defer></script>
    <script src="/solver/logistics.js?v=7" defer></script>
    <script src="/solver/ranking.js?v=7" defer></script>
    <script src="/solver/solver.js?v=7" defer></script>
    <script src="/ai/context-builder.js?v=7" defer></script>
    <script src="/ai/openrouter.js?v=7" defer></script>
    <script src="/js/app.js?v=7" defer></script>
  </body>
</html>
