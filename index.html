<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FertiCalc — SoloForte</title>
<link rel="stylesheet" href="app.css">
</head>

<body>

<header id="hdr">
  <div class="brand">
    <div class="brand-logo">🌱</div>
    <div>
      <div class="brand-name">FertiCalc</div>
      <div class="brand-sub">SoloForte</div>
    </div>
  </div>

  <span class="ht">Fertilizantes</span>

  <div class="hr">
    <button class="btn-xs" onclick="navTo('import')">📥 Importar</button>
    <button class="btn-xs" onclick="navTo('calc')">🧪 Calculadora</button>
    <button class="btn-add" onclick="openAddProduct()">+ Novo Produto</button>
  </div>
</header>

<div id="body">

  <!-- ESQUERDA -->
  <section id="lp">
    <div class="ph">
      <span class="pt">Cadastrados</span>
      <span id="fert-cnt">0 produtos</span>
    </div>
    <div id="flist" class="pl"></div>
  </section>

  <!-- DIREITA -->
  <section id="rp">

    <div class="view active">

      <div class="filters">

        <div class="ftitle">Parâmetros do cálculo</div>

        <div class="g2">
          <div class="fi">
            <span class="sl">Cultura</span>
            <select class="sel">
              <option>Soja</option>
              <option>Milho</option>
            </select>
          </div>

          <div class="fi">
            <span class="sl">Área (ha)</span>
            <input type="number" id="fa" class="inp" value="900">
          </div>
        </div>

        <span class="sl">Metas nutricionais</span>

        <div class="g4">
          <input id="fn" class="inp" value="0">
          <input id="fp" class="inp" value="90">
          <input id="fk" class="inp" value="120">
          <input id="fs" class="inp" value="0">
        </div>

        <div class="g2">
          <input id="fkbase" class="inp" placeholder="K base">
        </div>

        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">

          <button class="btn-c" onclick="run()">⚡ Calcular</button>

          <!-- ✅ BOTÃO NOVO -->
          <button id="btn-reset"
            class="btn-outline"
            style="display:none"
            onclick="resetCalc()">
            ← Refazer cálculo
          </button>

        </div>

      </div>

      <!-- RESULTADO -->
      <div id="res-scroll">

        <div id="emp-calc" class="empty-r">
          <div style="font-size:22px">📊</div>
          <div>Aguardando cálculo</div>
        </div>

        <div id="res-cards" style="display:none"></div>

      </div>

    </div>

  </section>
</div>

<div id="tw"></div>

<script src="app.js"></script>

</body>
</html>
